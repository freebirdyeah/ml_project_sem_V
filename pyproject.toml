[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-recipe"
version = "1.0.0"
description = "Circuit-aware supervised selection of ABC logic synthesis recipes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "scikit-learn>=1.5", "lightgbm>=4.3", "matplotlib>=3.6", "joblib>=1.3", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
circuit-recipe = "circuit_recipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
